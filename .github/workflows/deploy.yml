
name: Deploy To Ubuntu

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: node-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: self-hosted

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Check Node Version
        run: |
          node --version
          npm --version

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Build Application
        run: npm run build

      - name: Prepare Release
        run: |
          set -euo pipefail
          test -f dist/server.js

          tar -czf "node-demo-${GITHUB_RUN_NUMBER}.tar.gz" \
            dist package.json package-lock.json

      - name: Deploy Application
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/home/jagadish/node-demo"
          RELEASE_DIR="$DEPLOY_ROOT/releases/$BUILD_NUMBER"
          ARTIFACT="node-demo-${BUILD_NUMBER}.tar.gz"

          mkdir -p "$RELEASE_DIR"
          tar -xzf "$ARTIFACT" -C "$RELEASE_DIR"

          cd "$RELEASE_DIR"
          npm ci --omit=dev

          # Update the active release
          ln -sfn "$RELEASE_DIR" "$DEPLOY_ROOT/current"

          # Restart the systemd-managed application
          sudo -n /usr/bin/systemctl restart node-demo

      - name: Verify Deployment
        run: |
          set -euo pipefail

          for i in $(seq 1 15); do
            if curl --fail --silent --show-error \
              http://localhost:3000/health; then
              echo "Health check passed"
              break
            fi

            if [ "$i" -eq 15 ]; then
              echo "Health check failed"
              sudo systemctl status node-demo --no-pager -l || true
              sudo journalctl -u node-demo -n 50 --no-pager || true
              exit 1
            fi

            sleep 2
          done

          echo "Deployment completed successfully"
