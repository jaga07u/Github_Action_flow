
name: Deploy To Ubuntu

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: node-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: self-hosted

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Check Node Version
        run: |
          node --version
          npm --version

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Build Application
        run: npm run build

      - name: Prepare Release
        run: |
          set -e
          test -f dist/server.js
          tar -czf "node-demo-${GITHUB_RUN_NUMBER}.tar.gz" \
            dist package.json package-lock.json

      - name: Deploy Application
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          DEPLOY_ROOT="/home/jagadish/node-demo"
          RELEASE_DIR="$DEPLOY_ROOT/releases/$BUILD_NUMBER"
          ARTIFACT="node-demo-${BUILD_NUMBER}.tar.gz"

          mkdir -p "$RELEASE_DIR"

          tar -xzf "$ARTIFACT" -C "$RELEASE_DIR"

          cd "$RELEASE_DIR"
          npm ci --omit=dev

          # Stop the previous application
          if [ -f "$DEPLOY_ROOT/app.pid" ]; then
            OLD_PID=$(cat "$DEPLOY_ROOT/app.pid")

            if kill -0 "$OLD_PID" 2>/dev/null; then
              kill "$OLD_PID"

              for i in $(seq 1 10); do
                kill -0 "$OLD_PID" 2>/dev/null || break
                sleep 1
              done

              if kill -0 "$OLD_PID" 2>/dev/null; then
                echo "Old application did not stop"
                exit 1
              fi
            fi
          fi

          # Update the current release
          ln -sfn "$RELEASE_DIR" "$DEPLOY_ROOT/current"

          # Start the application
          cd "$RELEASE_DIR"

          nohup env \
            APP_VERSION="$BUILD_NUMBER" \
            PORT=3000 \
            node dist/server.js \
            > "$DEPLOY_ROOT/app.log" 2>&1 &

          echo $! > "$DEPLOY_ROOT/app.pid"

      - name: Verify Deployment
        run: |
          set -e

          for i in $(seq 1 10); do
            if curl --fail --silent \
              http://localhost:3000/health; then
              echo "Deployment successful"
              exit 0
            fi

            sleep 3
          done

          echo "Health check failed"
          cat /home/node-demo/app.log
          exit 1
